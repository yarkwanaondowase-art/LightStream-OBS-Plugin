name: Build Windows Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          path: obs-studio
          fetch-depth: 1

      - name: Configure OBS Studio
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-build

      - name: Build OBS libobs
        shell: pwsh
        run: |
          cmake --build obs-build --config Release --target libobs

      - name: Configure LightStream
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DOBS_SOURCE_DIR="$env:GITHUB_WORKSPACE\obs-studio" `
            -DOBS_BUILD_DIR="$env:GITHUB_WORKSPACE\obs-build"

      - name: Build LightStream
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          $dll = Get-ChildItem -Path build -Filter "lightstream.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $dll) {
            Write-Error "lightstream.dll was not produced."
            exit 1
          }

          Copy-Item $dll.FullName package\lightstream.dll

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Plugin
          path: package
