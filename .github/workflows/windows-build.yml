name: Build Windows Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Find plugin
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter "lightstream.dll" -Recurse | Select-Object -First 1

          if ($null -eq $dll) {
            Write-Error "lightstream.dll was not created."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path package
          Copy-Item $dll.FullName package\lightstream.dll

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Plugin
          path: package
