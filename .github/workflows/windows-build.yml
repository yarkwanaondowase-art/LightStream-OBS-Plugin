name: Build Windows Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Download OBS Studio source
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-studio.git obs-studio

      - name: Set OBS source directory
        shell: pwsh
        run: |
          "OBS_SOURCE_DIR=$env:GITHUB_WORKSPACE\obs-studio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          if (Test-Path "build\Release") {
            Copy-Item "build\Release\*" "package\" -Recurse -Force
          } else {
            Copy-Item "build\*" "package\" -Recurse -Force
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Plugin
          path: package
